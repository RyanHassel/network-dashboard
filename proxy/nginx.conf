server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=2s ipv6=off;

    location = /_updating.html {
        root /usr/share/nginx/updating;
        try_files /updating.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-NetDash-Updating-Page "1" always;
    }

    location = /update-progress.json {
        root /var/lib/netdash-state;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /update-progress.json =404;
        error_page 404 =200 /_update-idle.json;
    }

    location = /_update-idle.json {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 '{"status":"idle","overall_pct":0,"phase":"idle","message":"No active update","components":[]}';
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /_api-updating.json;
    }

    location = /_api-updating.json {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 503 '{"status":"updating","detail":"Backend API service is starting or updating."}';
    }

    location /ws/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
        error_page 502 503 504 =200 /_updating.html;
    }
}
