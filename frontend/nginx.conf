server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Serve real-time update progress state directly (works even while API restarts)
    location = /update-progress.json {
        root /var/lib/netdash-state;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /update-progress.json =404;
        error_page 404 =200 /_update-idle.json;
    }

    location = /_update-idle.json {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 '{"status":"idle","overall_pct":0,"phase":"idle","message":"No active update","components":[]}';
    }

    # Reverse proxy REST API requests to FastAPI container (dynamic DNS so frontend boots without API)
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy WebSocket connections
    location /ws/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
    }

    # SPA fallback routing with live-frontend readiness header
    location = /index.html {
        add_header X-NetDash-Frontend "1" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        add_header X-NetDash-Frontend "1" always;
        try_files $uri $uri/ /index.html;
    }
}
