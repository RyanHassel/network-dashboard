# ==============================================================================
# NetDash Vector Syslog Pipeline
# Listens on unprivileged UDP/TCP 1514 (mapped from host SYSLOG_PORT 514),
# and ships batched JSON events to FastAPI (/api/logs/ingest) -> TimescaleDB.
# ==============================================================================

data_dir: "/var/lib/vector"

sources:
  syslog_udp:
    type: socket
    address: "0.0.0.0:1514"
    mode: udp
    max_length: 65536
    host_key: "source_ip"

  syslog_tcp:
    type: socket
    address: "0.0.0.0:1514"
    mode: tcp
    host_key: "source_ip"
    framing:
      method: newline_delimited
      newline_delimited:
        max_length: 65536

sinks:
  netdash_api_logs:
    type: http
    inputs:
      - syslog_udp
      - syslog_tcp
    uri: "http://api:8000/api/logs/ingest"
    method: post
    compression: none
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_events: 100
      timeout_secs: 2
    buffer:
      type: memory
      max_events: 10000
      when_full: drop_newest
    healthcheck:
      enabled: false
